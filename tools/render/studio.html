<!doctype html>
<!--
  VELOURA offline asset studio.
  Renders the original theme imagery (hero displays, gift boxes, discovery set, demo bottles, textures)
  from the same procedural engine used on the storefront (veloura-theme/assets/veloura-3d.js).
  Run: see tools/render/README.md
-->
<html><head><meta charset="utf-8"><style>body{margin:0;background:#777}#s{position:relative}canvas{width:100%;height:100%;display:block}</style></head>
<body><div id="s"></div>
<script type="module">
import * as V from './assets/veloura-3d.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1200), H = +(q.get('h') || 1200);
const el = document.getElementById('s');
el.style.width = W + 'px'; el.style.height = H + 'px';
const threeUrl = new URL('./assets/three.module.min.js', location.href).href;
const kind = q.get('kind') || 'display';
const world = q.get('world') || 'noir';

async function texture() {
  const c = kind === 'satin' ? satinCanvas(W, H) : V.marbleCanvas(world, W, H, +(q.get('seed') || 11));
  c.id = 'out'; document.body.appendChild(c);
  window.inst = { canvas: c, renderOnce() {} };
}

function satinCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const base = ctx.createLinearGradient(0, 0, w, h);
  base.addColorStop(0, '#F05291'); base.addColorStop(0.45, '#F3A6C5'); base.addColorStop(1, '#FAD5E2');
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  // satin folds: layered soft diagonal highlights and shadows
  for (let i = 0; i < 14; i++) {
    const x = (i / 14) * w * 1.6 - w * 0.3;
    const g = ctx.createLinearGradient(x, 0, x + w * 0.22, h * 0.35);
    const hi = i % 2 === 0;
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.5, hi ? 'rgba(255,240,245,0.38)' : 'rgba(152,31,80,0.22)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save();
    ctx.translate(w / 2, h / 2); ctx.rotate(-0.5 + Math.sin(i) * 0.08); ctx.translate(-w / 2, -h / 2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, -h);
    for (let y = -h; y <= h * 2; y += 20) ctx.lineTo(x + Math.sin(y / 180 + i) * 60, y);
    ctx.lineTo(x + w * 0.22, h * 2); ctx.lineTo(x + w * 0.22, -h);
    ctx.fill();
    ctx.restore();
  }
  ctx.filter = 'blur(18px)';
  ctx.drawImage(c, 0, 0);
  return c;
}

async function loadImage(src) {
  const img = new Image(); img.src = src; await img.decode(); return img;
}

async function studioScene(build) {
  const THREE = await V.loadThree(threeUrl);
  const pal = V.PALETTES[world];
  const canvas = document.createElement('canvas');
  el.appendChild(canvas);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H, false);
  renderer.toneMapping = world === 'rose' ? THREE.NeutralToneMapping : THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = world === 'rose' ? 0.95 : 1.15;
  renderer.setClearColor(0, 0);
  const scene = new THREE.Scene();
  scene.environment = V.buildEnvironment(renderer, pal);
  const key = new THREE.DirectionalLight(pal.key, 2.4); key.position.set(-5, 9, 7);
  const rim = new THREE.PointLight(pal.rim, 90, 40); rim.position.set(6, 7, -5);
  scene.add(key, rim, new THREE.AmbientLight(pal.ambient, 1.3));
  const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);
  await build(THREE, scene, camera, pal);
  renderer.render(scene, camera);
  window.inst = { canvas, renderOnce: () => renderer.render(scene, camera) };
}

async function monogramTexture(THREE, color, cw = 1024, chh = 1024) {
  const svgText = await (await fetch(world === 'noir' ? './Veloura_Noir_Monogram.svg' : './Veloura_Rose_Monogram.svg')).text();
  const c = document.createElement('canvas'); c.width = cw; c.height = chh;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color; ctx.fillRect(0, 0, cw, chh);
  const tinted = world === 'rose' ? svgText.replace(/#981F50/g, '#B76E79').replace(/#F05291/g, '#E8B4A0').replace(/#F3A6C5/g, '#F7D9CF') : svgText;
  const img = await loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(tinted));
  const sz = Math.min(cw, chh) * 0.5; ctx.drawImage(img, (cw - sz) / 2, (chh - sz) / 2 - sz * 0.04, sz, sz);
  ctx.font = '600 64px Cinzel, Georgia, serif';
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function giftBox(THREE, opts) {
  const g = new THREE.Group();
  const { w, d, h, lidH, color, ribbon, lidTex, bow } = opts;
  const paper = new THREE.MeshPhysicalMaterial({ color, roughness: world === 'noir' ? 0.38 : 0.5, sheen: world === 'noir' ? 0 : 0.25, sheenColor: new THREE.Color(0xffd6e6), clearcoat: world === 'noir' ? 0.5 : 0.15, envMapIntensity: world === 'noir' ? 0.6 : 0.8 });
  const lidTop = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: lidTex, roughness: 0.45, clearcoat: 0.3, envMapIntensity: 0.6 });
  const rib = new THREE.MeshPhysicalMaterial({ color: ribbon, metalness: world === 'noir' ? 0.9 : 0.15, roughness: world === 'noir' ? 0.25 : 0.35, sheen: 1, sheenColor: new THREE.Color(ribbon), clearcoat: 0.6 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), paper); body.position.y = h / 2;
  const lid = new THREE.Mesh(new THREE.BoxGeometry(w * 1.03, lidH, d * 1.03), [paper, paper, lidTop, paper, paper, paper]);
  lid.position.y = h - lidH / 2 + 0.25;
  g.add(body, lid);
  // ribbon band (vertical, around the box front-to-back), off-centre like the brand board
  const bandW = w * 0.09;
  const band1 = new THREE.Mesh(new THREE.BoxGeometry(bandW, h + 0.3, d * 1.05), rib);
  band1.position.set(w * 0.22, h / 2 + 0.12, 0);
  g.add(band1);
  if (bow) {
    const band2 = new THREE.Mesh(new THREE.BoxGeometry(w * 1.05, h * 0.12, bandW), rib);
    band2.position.set(0, h * 0.5, d * 0.22);
    const loopGeo = new THREE.TorusGeometry(1, 0.16, 12, 64);
    const cx = w * 0.22, cz = 0, top = h + 0.45;
    const l1 = new THREE.Mesh(loopGeo, rib); l1.scale.set(1.3, 0.6, 0.3); l1.rotation.set(-1.4, 0.35, 0.3); l1.position.set(cx - 1.05, top + 0.35, cz);
    const l2 = new THREE.Mesh(loopGeo, rib); l2.scale.set(1.3, 0.6, 0.3); l2.rotation.set(-1.4, -0.35, -0.3); l2.position.set(cx + 1.05, top + 0.35, cz);
    const knot = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 16), rib); knot.scale.set(1, 0.7, 1); knot.position.set(cx, top + 0.15, cz);
    const tailGeo = new THREE.BoxGeometry(0.5, 0.06, 2.2);
    const t1 = new THREE.Mesh(tailGeo, rib); t1.position.set(cx - 0.5, top - 0.05, cz + 1.2); t1.rotation.y = 0.35;
    const t2 = new THREE.Mesh(tailGeo, rib); t2.position.set(cx + 0.5, top - 0.05, cz + 1.2); t2.rotation.y = -0.35;
    g.add(l1, l2, knot, t1, t2);
  }
  return g;
}

async function gift() {
  await studioScene(async (THREE, scene, camera, pal) => {
    const isNoir = world === 'noir';
    const tex = await monogramTexture(THREE, isNoir ? '#0E0E10' : '#F27AA8');
    const box = giftBox(THREE, { w: 8, d: 6, h: 4.2, lidH: 1.6, color: isNoir ? 0x0e0e10 : 0xf27aa8, ribbon: isNoir ? 0xc9a873 : 0xfad5e2, lidTex: tex, bow: !isNoir });
    box.rotation.y = -0.55;
    scene.add(box);
    const sh = V.contactShadow(14, isNoir ? 0.8 : 0.45); sh.position.y = 0.01; scene.add(sh);
    camera.position.set(0, 9, 17); camera.lookAt(0, 2.2, 0);
  });
}

async function discovery() {
  await studioScene(async (THREE, scene, camera, pal) => {
    const isNoir = world === 'noir';
    const trayMat = new THREE.MeshPhysicalMaterial({ color: isNoir ? 0x0f0f11 : 0xe94f8c, roughness: 0.45, clearcoat: 0.3, envMapIntensity: 0.7 });
    const insert = new THREE.MeshPhysicalMaterial({ color: isNoir ? 0x1d1e22 : 0xf8bcd3, roughness: 0.9, sheen: 0.6, sheenColor: new THREE.Color(isNoir ? 0x3a3b40 : 0xffe0ec) });
    const gold = new THREE.MeshStandardMaterial({ color: isNoir ? 0xc9a873 : 0xe7b2a1, metalness: 1, roughness: 0.25 });
    const tray = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(12, 1.6, 5.2), trayMat); base.position.y = 0.8;
    const pad = new THREE.Mesh(new THREE.BoxGeometry(11.4, 0.2, 4.6), insert); pad.position.y = 1.62;
    const trim = new THREE.Mesh(new THREE.BoxGeometry(12.04, 0.08, 5.24), gold); trim.position.y = 1.6;
    tray.add(base, pad, trim);
    const lidTex = await monogramTexture(THREE, isNoir ? '#0F0F11' : '#E94F8C', 1200, 520);
    const lid = new THREE.Mesh(new THREE.BoxGeometry(12, 5.2, 0.5), [trayMat, trayMat, trayMat, trayMat, new THREE.MeshPhysicalMaterial({ map: lidTex, roughness: 0.5 }), trayMat]);
    lid.position.set(0, 3.6, -3.2); lid.rotation.x = -0.32;
    // crop monogram texture onto the 12x5.2 face
    tray.add(lid);
    const pals = isNoir
      ? [0x9a6a34, 0x5a3615, 0xb07a2e, 0x7a5a3a, 0xc08a40]
      : [0xf05291, 0xf6a9c4, 0xe8327a, 0xfad5e2, 0xf27aa8];
    const shapes = ['round', 'square', 'faceted', 'round', 'square'];
    const caps = isNoir ? ['cylinder', 'block', 'cylinder', 'block', 'cylinder'] : ['dome', 'cylinder', 'gem', 'dome', 'cylinder'];
    pals.forEach((liq, i) => {
      const b = V.buildBottle({ shape: shapes[i], cap: caps[i], glass: isNoir ? 0x9aa0aa : 0xffd3e4, liquid: liq, metal: isNoir ? 'gold' : 'rosegold', capColor: isNoir && caps[i] === 'block' ? 0x0d0d0f : (caps[i] === 'gem' ? 0xff9cc4 : undefined) }, 'high');
      b.scale.setScalar(0.3);
      b.position.set(-4.4 + i * 2.2, 1.7, 0.3);
      b.rotation.y = -0.3 + i * 0.15;
      tray.add(b);
    });
    tray.rotation.y = -0.25;
    scene.add(tray);
    const sh = V.contactShadow(18, isNoir ? 0.8 : 0.4); sh.scale.set(1, 0.6, 1); scene.add(sh);
    camera.position.set(0, 8.5, 17); camera.lookAt(0, 2, 0);
  });
}

async function scale() {
  // "Miniature luxury" editorial: a full-size bottle next to its mini
  await studioScene(async (THREE, scene, camera, pal) => {
    const spec = Object.assign({}, pal.bottles[1]);
    const big = V.buildBottle(spec, 'high'); big.position.x = -1.6; big.rotation.y = -0.4;
    const mini = V.buildBottle(spec, 'high'); mini.scale.setScalar(0.42); mini.position.set(2.6, 0, 1.2); mini.rotation.y = -0.6;
    scene.add(big, mini);
    const sh = V.contactShadow(12, world === 'noir' ? 0.75 : 0.4); scene.add(sh);
    camera.position.set(0, 4, 24); camera.lookAt(0.4, 3.4, 0);
  });
}

if (kind === 'marble' || kind === 'satin') await texture();
else if (kind === 'gift') await gift();
else if (kind === 'discovery') await discovery();
else if (kind === 'scale') await scale();
else {
  window.inst = await V.mount(el, {
    threeUrl, scene: kind, world, quality: 'high', preserveDrawingBuffer: true, reducedMotion: true, maxDpr: 1,
    bottle: q.get('bottle') ? JSON.parse(q.get('bottle')) : undefined,
  });
}
window.ready = true;
</script></body></html>
