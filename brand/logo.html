<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=block" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Cinzel', serif; }
  .card { width: 1200px; height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .dark { background: #0b0b0c; }
  .light { background: #f6f1e7; }
  .wide { width: 1600px; height: 600px; flex-direction: row; gap: 56px; }
  .word { text-align: center; line-height: 1; }
  .word .p { font-weight: 700; font-size: 128px; letter-spacing: 18px; margin-right: -18px; }
  .word .v { font-weight: 500; font-size: 46px; letter-spacing: 34px; margin-right: -34px; margin-top: 26px; display: flex; align-items: center; justify-content: center; gap: 28px; }
  .word .v::before, .word .v::after { content: ""; width: 90px; height: 2px; background: currentColor; opacity: .8; }
  .gold { background: linear-gradient(180deg, #f3dc9b 0%, #d4a94a 45%, #a87b2a 70%, #e8c877 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gold .v::before, .gold .v::after { background: #c99a3e; }
  .ink { color: #0b0b0c; }
  .tag { margin-top: 40px; font-size: 22px; letter-spacing: 10px; color: #8a7a5a; }
  .wide .word { text-align: left; }
  .wide .word .v { justify-content: flex-start; }
  .wide .word .v::before { display: none; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dc9b"/><stop offset=".45" stop-color="#d4a94a"/>
      <stop offset=".7" stop-color="#a87b2a"/><stop offset="1" stop-color="#e8c877"/>
    </linearGradient>
    <symbol id="vault" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="94" fill="none" stroke="currentColor" stroke-width="5"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="2"/>
      <!-- bolts -->
      <g fill="currentColor">
        <circle cx="100" cy="13" r="4"/><circle cx="100" cy="187" r="4"/>
        <circle cx="13" cy="100" r="4"/><circle cx="187" cy="100" r="4"/>
        <circle cx="38.5" cy="38.5" r="4"/><circle cx="161.5" cy="38.5" r="4"/>
        <circle cx="38.5" cy="161.5" r="4"/><circle cx="161.5" cy="161.5" r="4"/>
      </g>
      <!-- wheel handle -->
      <g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none">
        <circle cx="100" cy="100" r="44"/>
        <line x1="100" y1="34" x2="100" y2="166"/>
        <line x1="42.8" y1="67" x2="157.2" y2="133"/>
        <line x1="42.8" y1="133" x2="157.2" y2="67"/>
      </g>
      <g fill="currentColor">
        <circle cx="100" cy="34" r="7"/><circle cx="100" cy="166" r="7"/>
        <circle cx="42.8" cy="67" r="7"/><circle cx="157.2" cy="133" r="7"/>
        <circle cx="42.8" cy="133" r="7"/><circle cx="157.2" cy="67" r="7"/>
      </g>
      <circle cx="100" cy="100" r="24" style="fill:var(--bg,#0b0b0c)" stroke="currentColor" stroke-width="4"/>
      <text x="100" y="111" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="30" fill="currentColor">P</text>
    </symbol>
  </defs>
</svg>

<!-- 1. Primary: gold on black -->
<div class="card dark" id="primary">
  <svg width="300" height="300" style="color:#d4a94a"><use href="#vault"/></svg>
  <div style="height:56px"></div>
  <div class="word gold"><div class="p">PRESTIGE</div><div class="v">VAULT</div></div>
  <div class="tag">DISPLAY YOUR SUCCESS</div>
</div>

<!-- 2. Light version -->
<div class="card light" id="light" style="--bg:#f6f1e7">
  <svg width="300" height="300" style="color:#0b0b0c"><use href="#vault"/></svg>
  <div style="height:56px"></div>
  <div class="word ink"><div class="p">PRESTIGE</div><div class="v">VAULT</div></div>
</div>

<!-- 3. Horizontal -->
<div class="card dark wide" id="horizontal">
  <svg width="300" height="300" style="color:#d4a94a"><use href="#vault"/></svg>
  <div class="word gold"><div class="p">PRESTIGE</div><div class="v">VAULT</div></div>
</div>

<!-- 4. Icon / profile picture -->
<div class="card dark" id="icon">
  <svg width="760" height="760" style="color:#d4a94a"><use href="#vault"/></svg>
</div>

</body>
</html>
