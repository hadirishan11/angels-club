<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Cinzel:wght@400&display=block" rel="stylesheet">
<style>
  :root { --gold: #c9a961; --black: #0a0a0a; }
  body { margin: 0; background: var(--black); }
  .card { width: 1200px; height: 1200px; background: var(--black); color: var(--gold);
          display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .cream { background: #f4efe6; color: #0a0a0a; }
  .wm { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 72px;
        letter-spacing: 26px; margin-right: -26px; line-height: 1; }
  .sub { font-family: 'Cinzel', serif; font-size: 17px; letter-spacing: 12px; margin-right: -12px;
         margin-top: 34px; opacity: .85; display: flex; align-items: center; gap: 26px; }
  .sub::before, .sub::after { content: ""; width: 60px; height: 1px; background: currentColor; opacity: .7; }
  .gap { height: 70px; }
</style>
</head>
<body>

<!-- A: PV monogram -->
<div class="card" id="monogram">
  <svg width="300" height="300" viewBox="0 0 300 300" fill="none" stroke="currentColor">
    <circle cx="150" cy="150" r="146" stroke-width="1.2"/>
    <circle cx="150" cy="150" r="136" stroke-width="0.6"/>
    <text x="150" y="196" text-anchor="middle" font-family="Cormorant Garamond" font-weight="300"
          font-size="150" fill="currentColor" stroke="none" letter-spacing="-38">PV</text>
  </svg>
  <div class="gap"></div>
  <div class="wm">PRESTIGE VAULT</div>
  <div class="sub">PRIVATE COLLECTION</div>
</div>

<!-- B: Keyhole crest -->
<div class="card" id="keyhole">
  <svg width="260" height="260" viewBox="0 0 260 260" fill="none" stroke="currentColor">
    <rect x="45" y="45" width="170" height="170" transform="rotate(45 130 130)" stroke-width="1.2"/>
    <rect x="57" y="57" width="146" height="146" transform="rotate(45 130 130)" stroke-width="0.6"/>
    <circle cx="130" cy="114" r="17" fill="currentColor" stroke="none"/>
    <path d="M123 122 L116 164 H144 L137 122 Z" fill="currentColor" stroke="none"/>
  </svg>
  <div class="gap"></div>
  <div class="wm">PRESTIGE VAULT</div>
  <div class="sub">EST. 2026</div>
</div>

<!-- C: Pure wordmark -->
<div class="card" id="wordmark">
  <div style="font-family:'Cormorant Garamond';font-weight:300;font-size:150px;letter-spacing:22px;margin-right:-22px;line-height:1">PRESTIGE</div>
  <div style="width:520px;height:1px;background:currentColor;margin:38px 0;opacity:.8"></div>
  <div style="font-family:'Cinzel';font-size:36px;letter-spacing:44px;margin-right:-44px">VAULT</div>
  <div style="font-family:'Cormorant Garamond';font-style:italic;font-size:30px;margin-top:60px;opacity:.75">by invitation only</div>
</div>

<!-- Profile icons -->
<div class="card" id="icon-monogram">
  <svg width="760" height="760" viewBox="0 0 300 300" fill="none" stroke="currentColor">
    <circle cx="150" cy="150" r="146" stroke-width="1.2"/>
    <circle cx="150" cy="150" r="136" stroke-width="0.6"/>
    <text x="150" y="196" text-anchor="middle" font-family="Cormorant Garamond" font-weight="300"
          font-size="150" fill="currentColor" stroke="none" letter-spacing="-38">PV</text>
  </svg>
</div>
<div class="card" id="icon-keyhole">
  <svg width="760" height="760" viewBox="0 0 260 260" fill="none" stroke="currentColor">
    <rect x="45" y="45" width="170" height="170" transform="rotate(45 130 130)" stroke-width="1.2"/>
    <rect x="57" y="57" width="146" height="146" transform="rotate(45 130 130)" stroke-width="0.6"/>
    <circle cx="130" cy="114" r="17" fill="currentColor" stroke="none"/>
    <path d="M123 122 L116 164 H144 L137 122 Z" fill="currentColor" stroke="none"/>
  </svg>
</div>

</body>
</html>
