# Run in the Shopify GraphiQL App (Admin API) to create all Veloura metafield definitions at once.
# Each definition is pinned so it shows on the product / collection edit page.

mutation VelouraMetafieldDefinitions {
  tagline: metafieldDefinitionCreate(definition: { name: "Tagline", namespace: "veloura", key: "tagline", ownerType: PRODUCT, type: "single_line_text_field", pin: true }) { createdDefinition { id } userErrors { field message } }
  notesTop: metafieldDefinitionCreate(definition: { name: "Top notes", namespace: "veloura", key: "notes_top", ownerType: PRODUCT, type: "list.single_line_text_field", pin: true }) { createdDefinition { id } userErrors { field message } }
  notesHeart: metafieldDefinitionCreate(definition: { name: "Heart notes", namespace: "veloura", key: "notes_heart", ownerType: PRODUCT, type: "list.single_line_text_field", pin: true }) { createdDefinition { id } userErrors { field message } }
  notesBase: metafieldDefinitionCreate(definition: { name: "Base notes", namespace: "veloura", key: "notes_base", ownerType: PRODUCT, type: "list.single_line_text_field", pin: true }) { createdDefinition { id } userErrors { field message } }
  longevity: metafieldDefinitionCreate(definition: { name: "Longevity (1-5)", namespace: "veloura", key: "longevity", ownerType: PRODUCT, type: "number_integer", pin: true, validations: [{ name: "min", value: "1" }, { name: "max", value: "5" }] }) { createdDefinition { id } userErrors { field message } }
  sillage: metafieldDefinitionCreate(definition: { name: "Sillage (1-5)", namespace: "veloura", key: "sillage", ownerType: PRODUCT, type: "number_integer", pin: true, validations: [{ name: "min", value: "1" }, { name: "max", value: "5" }] }) { createdDefinition { id } userErrors { field message } }
  season: metafieldDefinitionCreate(definition: { name: "Season", namespace: "veloura", key: "season", ownerType: PRODUCT, type: "list.single_line_text_field", pin: true, validations: [{ name: "choices", value: "[\"Spring\",\"Summer\",\"Autumn\",\"Winter\"]" }] }) { createdDefinition { id } userErrors { field message } }
  occasion: metafieldDefinitionCreate(definition: { name: "Occasion", namespace: "veloura", key: "occasion", ownerType: PRODUCT, type: "list.single_line_text_field", pin: true }) { createdDefinition { id } userErrors { field message } }
  family: metafieldDefinitionCreate(definition: { name: "Scent family", namespace: "veloura", key: "scent_family", ownerType: PRODUCT, type: "list.single_line_text_field", pin: true, validations: [{ name: "choices", value: "[\"Woody\",\"Amber\",\"Fresh\",\"Floral\",\"Gourmand\",\"Citrus\"]" }] }) { createdDefinition { id } userErrors { field message } }
  concentration: metafieldDefinitionCreate(definition: { name: "Concentration", namespace: "veloura", key: "concentration", ownerType: PRODUCT, type: "single_line_text_field", pin: true }) { createdDefinition { id } userErrors { field message } }
  perfumer: metafieldDefinitionCreate(definition: { name: "Perfumer", namespace: "veloura", key: "perfumer", ownerType: PRODUCT, type: "single_line_text_field", pin: true }) { createdDefinition { id } userErrors { field message } }
  year: metafieldDefinitionCreate(definition: { name: "Year", namespace: "veloura", key: "year", ownerType: PRODUCT, type: "number_integer", pin: true }) { createdDefinition { id } userErrors { field message } }
  volume: metafieldDefinitionCreate(definition: { name: "Volume (ml)", namespace: "veloura", key: "volume_ml", ownerType: PRODUCT, type: "number_integer", pin: true }) { createdDefinition { id } userErrors { field message } }
  limited: metafieldDefinitionCreate(definition: { name: "Limited batch", namespace: "veloura", key: "limited_batch", ownerType: PRODUCT, type: "boolean", pin: true }) { createdDefinition { id } userErrors { field message } }
  pairs: metafieldDefinitionCreate(definition: { name: "Pairs well with", namespace: "veloura", key: "pairs_with", ownerType: PRODUCT, type: "list.product_reference", pin: true }) { createdDefinition { id } userErrors { field message } }
  seoContent: metafieldDefinitionCreate(definition: { name: "SEO content", namespace: "veloura", key: "seo_content", ownerType: COLLECTION, type: "rich_text_field", pin: true }) { createdDefinition { id } userErrors { field message } }
  banner: metafieldDefinitionCreate(definition: { name: "Banner image", namespace: "veloura", key: "banner_image", ownerType: COLLECTION, type: "file_reference", pin: true, validations: [{ name: "file_type_options", value: "[\"Image\"]" }] }) { createdDefinition { id } userErrors { field message } }
}
